# app-gate example — Genymotion Desktop (native binary)
# Install:
#   app-gate install genymotion --from examples/genymotion.conf
# Edit GENYMOTION_DIR-related paths to match your install.

APP_NAME="Genymotion"
WINDOWS=12:30-12:45,16:00-16:15,19:00-19:30
UNLOCK_PIN=change-me

LAUNCH_MODE=command
# CHANGE ME: path to the genymotion launcher binary
LAUNCH_CMD=/home/YOU/genymotion/genymotion/genymotion

# Graceful VM stop, then patterns clean leftovers
STOP_CMD=/home/YOU/genymotion/genymotion/gmtool admin stopall

# Unique path fragments (avoid matching unrelated processes)
PROCESS_PATTERNS=/home/YOU/genymotion/genymotion/genymotion,/home/YOU/genymotion/genymotion/player,/home/YOU/genymotion/genymotion/qemu/

DESKTOP_FILENAME=genymotion-launchpad.desktop
DESKTOP_ICON=/home/YOU/genymotion/genymotion/icons/genymotion-logo.png
DESKTOP_CATEGORIES=Development;Emulator;
DESKTOP_STARTUP_WMCLASS=genymotion
