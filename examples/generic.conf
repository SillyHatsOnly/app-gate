# =============================================================================
# app-gate example — GENERIC TEMPLATE
# Copy to ~/.config/app-gate/apps/<app-id>.conf and fill in the values.
# =============================================================================

# Human-readable name (notifications / desktop entry)
APP_NAME="My App"

# Allowed windows: HH:MM-HH:MM, comma-separated (24h). End is exclusive.
# Midnight wrap is supported: 23:00-00:30
WINDOWS=12:30-12:45,16:00-16:15,19:00-19:30

# PIN for: app-gate <id> unlock <minutes>
# Leave empty to unlock without a PIN (not recommended).
UNLOCK_PIN=change-me

# How to start the app: "command" or "flatpak"
LAUNCH_MODE=command

# Used when LAUNCH_MODE=command — full command (no shell metacharacters needed)
LAUNCH_CMD=/usr/bin/my-app

# Used when LAUNCH_MODE=flatpak
FLATPAK_ID=
FLATPAK_ARGS=--branch=stable --arch=x86_64

# Optional graceful stop (runs before process kill). Example:
# STOP_CMD="/path/to/tool admin stopall"
STOP_CMD=

# Substrings matched against process cmdline (comma-separated).
# Used to detect "running" and to pkill leftovers.
# Tip: prefer unique path fragments, e.g. /opt/myapp/bin/myapp
PROCESS_PATTERNS=/usr/bin/my-app

# Desktop entry (menu launcher)
DESKTOP_FILENAME=app-gate-my-app.desktop
DESKTOP_ICON=application-x-executable
DESKTOP_CATEGORIES=Utility;
DESKTOP_STARTUP_WMCLASS=
