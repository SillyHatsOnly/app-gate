# Generic app-gate profile for Telegram (simple WINDOWS model).
# For the full weekday/weekend schedule + delayed unlock, use bin/tg-gate instead:
#   ./install.sh && tg-gate install

APP_NAME="Telegram"
WINDOWS=12:30-12:45,16:00-16:15,19:00-19:30
UNLOCK_PIN=

LAUNCH_MODE=flatpak
FLATPAK_ID=org.telegram.desktop
FLATPAK_ARGS=--branch=stable --arch=x86_64 --command=Telegram --file-forwarding

STOP_CMD=
PROCESS_PATTERNS=org.telegram.desktop

DESKTOP_FILENAME=org.telegram.desktop.desktop
DESKTOP_ICON=org.telegram.desktop
DESKTOP_CATEGORIES=Chat;Network;InstantMessaging;Qt;
DESKTOP_STARTUP_WMCLASS=TelegramDesktop
